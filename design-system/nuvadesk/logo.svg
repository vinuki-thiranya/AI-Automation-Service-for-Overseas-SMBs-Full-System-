<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nuvadesk">
  <!-- "N thread": a lowercase n drawn as one continuous line that finishes in a tick (a message comes in,
       and it ends booked). Colours: brand #0B5D6B, on-brand #FFFFFF, highlight #F2B33D. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8.5" fill="#0B5D6B"/>
  <path d="M9.5 23.5v-8.2a6.5 6.5 0 0 1 13 0v3.2" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M18.6 21.2l3.6 3.4 5.6-7.4" fill="none" stroke="#F2B33D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
